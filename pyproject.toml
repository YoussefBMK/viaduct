[project]
name = "viaduct"
version = "0.1.0"
description = "Viaduct — atopile hardware project with kicad-cli tooling"
readme = "README.md"
# atopile 0.15.x pins this range; uv will fetch a matching interpreter automatically.
requires-python = ">=3.14,<3.15"
dependencies = [
    "atopile>=0.15.9,<0.16",
    "skidl>=2.3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
